name: Changeset Notes Management

on:
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📂 Checkout Application Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Initialize Node Environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: "yarn"

      - name: 📦 Install Architecture Dependencies
        run: yarn install --immutable

      - name: 🦋 Sync Repository Changesets
        uses: ai-crew-suite/pipelines/actions/changeset-sync@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧬 Run Test Suite Validation Matrix
        run: yarn test
